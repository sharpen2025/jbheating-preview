<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>(주)중부난방공사 메인페이지 리뉴얼 시안 · 시안 A·B</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"Pretendard Variable",Pretendard,sans-serif;background:#E9EBEE;color:#1F2328;letter-spacing:-.02em}
.bar{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid #D9DCE1;box-shadow:0 2px 10px rgba(0,0,0,.04)}
.bar-in{display:flex;align-items:center;gap:20px;padding:12px 20px;flex-wrap:wrap}
.ttl{font-size:14px;font-weight:700;line-height:1.35;white-space:nowrap}
.ttl small{display:block;font-size:12px;font-weight:500;color:#6A717B}
.sw{display:flex;gap:10px;flex:1;min-width:0}
.sw button{font:inherit;cursor:pointer;flex:1;min-width:0;max-width:300px;text-align:left;border:1.5px solid #D6DAE0;background:#F7F8FA;border-radius:12px;padding:10px 16px;display:flex;align-items:center;gap:12px;transition:.15s}
.sw button:hover{border-color:#9AA2AD;background:#fff}
.sw button.on{border-color:#1F2328;background:#1F2328;color:#fff}
.sw .k{flex:none;width:30px;height:30px;border-radius:8px;background:#E3E6EA;color:#454C56;display:grid;place-items:center;font-weight:800;font-size:15px}
.sw button.on .k{background:#fff;color:#1F2328}
.sw b{display:block;font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sw small{display:block;font-size:12px;color:#7A818B;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sw button.on small{color:#B9BEC6}
.tools{display:flex;gap:6px;align-items:center}
.seg{display:flex;background:#EEF0F3;border-radius:10px;padding:3px}
.seg button{font:inherit;cursor:pointer;border:0;background:none;height:34px;padding:0 12px;border-radius:8px;font-size:13.5px;font-weight:600;color:#5A616B;white-space:nowrap}
.seg button.on{background:#fff;color:#1F2328;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.newwin{height:40px;padding:0 12px;border-radius:10px;border:1px solid #D6DAE0;display:inline-flex;align-items:center;font-size:13.5px;font-weight:600;color:#454C56;text-decoration:none;white-space:nowrap}
.newwin:hover{background:#F7F8FA}
.desc{padding:9px 20px;border-top:1px solid #EEF0F3;font-size:13.5px;color:#59606A;background:#FBFBFC}
.desc b{color:#1F2328}
.stage{display:flex;justify-content:center;padding:18px}
.frame{width:100%;max-width:1440px;background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 8px 30px rgba(0,0,0,.10);transition:max-width .3s}
.frame iframe{display:block;width:100%;border:0;height:800px;transform-origin:0 0}
.frame.m{max-width:410px;border:10px solid #1F2328;border-radius:36px}
.note{text-align:center;font-size:12px;color:#7A818B;padding:0 0 18px}
@media (max-width:900px){
  .bar-in{gap:10px;padding:10px 12px}
  .ttl{display:none}
  .sw{flex-basis:100%;gap:6px}
  .sw button{padding:8px 10px;gap:8px}
  .sw .k{width:24px;height:24px;font-size:13px}
  .sw b{font-size:13.5px}.sw small{font-size:11px}
  .tools{flex-basis:100%;justify-content:space-between}
  .desc{display:none}
  .stage{padding:0}
  .frame,.frame.m{border-radius:0;border:0;box-shadow:none}
}
</style>
</head>
<body>
<header class="bar">
  <div class="bar-in">
    <p class="ttl">(주)중부난방공사 메인 시안<small>시안 A · B</small></p>
    <div class="sw" role="tablist" aria-label="시안 선택">
      <button role="tab" data-id="a" data-f="a.html" data-d="<b>대웅제약 스타일</b> · 흰 배경 + 굵은 선언형 헤드라인, 첫 화면 벤토 그리드(대표 시공사례·현장 사진·상담전화·새 소식), 왼쪽 퀵탭, 현장 이야기, 제품군 탭, 대상별 바로가기."><span class="k">A</span><span><b>대웅제약 스타일</b><small>daewoong.co.kr</small></span></button>
      <button role="tab" data-id="b" data-f="b.html" data-d="<b>삼성웰스토리 360 스타일</b> · 중앙 가는 메뉴, 좌측 2줄 헤드라인 + 화면 끝까지 붙은 사진 슬라이드(진행바·썸네일), 시공 스토리 엇갈림 카드, 회색 솔루션 패널, 가정/기업 상담 진단, 새 소식 그리드, 오렌지 상담 플로팅 버튼."><span class="k">B</span><span><b>삼성웰스토리 360 스타일</b><small>360fnbsolution.com</small></span></button>
    </div>
    <div class="tools">
      <div class="seg" role="group" aria-label="미리보기 너비"><button class="on" data-w="d">데스크톱 1440</button><button data-w="m">모바일 390</button></div>
      <a class="newwin" id="open" href="a.html" target="_blank" rel="noopener">새 창으로 ↗</a>
    </div>
  </div>
  <p class="desc" id="desc"></p>
</header>
<div class="stage"><div class="frame" id="frame"><iframe id="ifr" title="시안 미리보기" src="about:blank"></iframe></div></div>
<p class="note">데스크톱 보기는 1440px 레이아웃을 화면 폭에 맞춰 축소해 보여줍니다. 디자인 시안입니다. 실제 사이트(jb9204.com)에는 반영되지 않았습니다. 레퍼런스 사이트의 로고·이미지·문구는 사용하지 않았습니다.</p>
<script>
(function(){
  var ifr=document.getElementById('ifr'),frame=document.getElementById('frame'),desc=document.getElementById('desc'),open=document.getElementById('open'),bar=document.querySelector('.bar');
  var btns=[].slice.call(document.querySelectorAll('.sw button')),cur=null;
  function fit(){var h=Math.max(520,window.innerHeight-bar.offsetHeight-(window.innerWidth>900?36:0));
    if(!frame.classList.contains('m')&&window.innerWidth>900){var avail=frame.parentNode.clientWidth-36,sc=Math.min(1,avail/1440);
      frame.style.width=Math.round(1440*sc)+'px';frame.style.height=h+'px';ifr.style.width='1440px';ifr.style.height=Math.round(h/sc)+'px';ifr.style.transform=sc<1?'scale('+sc+')':'';}
    else{frame.style.width='';frame.style.height='';ifr.style.width='';ifr.style.transform='';ifr.style.height=h+'px';}}
  function sel(id,push){var b=btns.filter(function(x){return x.dataset.id===id})[0]||btns[0];
    btns.forEach(function(x){var on=x===b;x.classList.toggle('on',on);x.setAttribute('aria-selected',String(on))});
    if(cur!==b.dataset.f){ifr.src=b.dataset.f;cur=b.dataset.f}
    open.href=b.dataset.f;desc.innerHTML=b.dataset.d;
    if(push&&location.hash!=='#'+b.dataset.id)history.replaceState(null,'','#'+b.dataset.id);
    fit()}
  btns.forEach(function(b){b.onclick=function(){sel(b.dataset.id,true)}});
  [].slice.call(document.querySelectorAll('.seg button')).forEach(function(b){b.onclick=function(){
    [].slice.call(document.querySelectorAll('.seg button')).forEach(function(x){x.classList.toggle('on',x===b)});
    frame.classList.toggle('m',b.dataset.w==='m');fit()}});
  window.addEventListener('hashchange',function(){sel(location.hash.slice(1))});
  window.addEventListener('resize',fit);
  sel((location.hash||'#a').slice(1).toLowerCase(),false);
})();
</script>
</body>
</html>
